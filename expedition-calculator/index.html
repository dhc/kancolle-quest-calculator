/* v1.1: fleet occupation and reverse expedition mapping */
.occupation{margin-top:17px;padding:16px;border:1px solid #dbe6ed;border-radius:11px;background:#f8fbfe}
.occupation h3{margin:0;font-size:13px}
.occupation .note:last-child{margin-bottom:0}
.occ-row{display:grid;grid-template-columns:minmax(105px,1fr) minmax(90px,2fr) minmax(115px,auto);align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #e8eef3}
.occ-row:last-of-type{border-bottom:0}
.occ-name{font-size:12px;font-weight:750;color:#3d5d72;min-width:0;overflow-wrap:anywhere}
.occ-meter{height:9px;border-radius:100px;background:#dfe9f0;overflow:hidden}
.occ-fill{height:100%;border-radius:100px;background:#4aa6bf;min-width:0}
.occ-fill.over{background:#e19942}
.occ-value{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;font-weight:750;white-space:nowrap}
.total-meter{height:11px;margin:13px 0 5px}
.map-groups{margin-top:15px}
.fleet-map-group{margin:13px 0;border:1px solid #e1eaf0;padding:14px;border-radius:12px;background:#fff}
.fleet-map-group .entry{margin:10px 0}
.fleet-map-group .entry:last-of-type{margin-bottom:2px}
.map-group-head h3{font-size:14px;margin:0 0 4px}
.map-group-head p{margin:0}
.map-empty{padding:10px 2px 0;margin:0}
.map-monthly-summary{font-size:14px;font-weight:800;color:#30516a;cursor:pointer;padding:5px 0}

@media(max-width:520px){.occ-row{grid-template-columns:1fr auto;gap:6px}.occ-row .occ-meter{grid-column:1/-1;grid-row:2}.occ-value{grid-column:2;grid-row:1}.occupation{padding:12px}.fleet-map-group{padding:10px}.map-group-head{flex-wrap:wrap}.map-group-head .btn{width:100%;margin-top:7px}}

/* v1.2: expedition picker with base rewards and duration */
.exp-field{flex:1 1 290px;min-width:240px;position:relative}
.exp-picker{position:relative;width:100%}
.exp-picker[open]{z-index:40}
.entry:has(.exp-picker[open]){position:relative;z-index:30}
.exp-picker-trigger{min-height:37px;display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:1px solid #d3e0e8;border-radius:8px;background:#fff;color:#24425a;list-style:none;cursor:pointer}
.exp-picker-trigger::-webkit-details-marker{display:none}
.exp-picker-trigger:focus-visible{outline:3px solid #83bdf3;outline-offset:1px}
.exp-picker[open]>.exp-picker-trigger{border-color:#4b9cc1;box-shadow:0 0 0 2px #dceff8}
.exp-option-title{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;font-size:12px}
.exp-picker-trigger .exp-option-title{font-size:13px}
.exp-picker-trigger .exp-caret{flex-shrink:0}
.exp-option-meta{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-shrink:0;white-space:nowrap}
.exp-time{color:#597b91;background:#edf4f8;border-radius:5px;padding:3px 6px;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.exp-resources{display:inline-flex;align-items:center;gap:3px}
.exp-res{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 3px;border-radius:4px;font-size:11px;font-weight:850;line-height:1}
.exp-res-fuel{color:#a75a14;background:#fff0df}
.exp-res-ammo{color:#b44c56;background:#fff0f0}
.exp-res-steel{color:#536579;background:#eaf0f5}
.exp-res-bauxite{color:#137c8b;background:#e1f5f5}
.exp-caret{font-size:12px;color:#678498;transition:transform .15s}
.exp-picker[open] .exp-caret{transform:rotate(180deg)}
.exp-picker-menu{position:absolute;top:calc(100% + 5px);left:0;width:min(565px,calc(100vw - 52px));background:#fff;border:1px solid #cbdfe9;border-radius:11px;box-shadow:0 14px 38px rgba(15,49,73,.22);z-index:50;overflow:hidden}
.exp-picker-search{padding:9px;border-bottom:1px solid #e4edf3;background:#f8fbfd}
.exp-picker-search input{width:100%;background:white;border:1px solid #d3e0e8;border-radius:7px;padding:9px}
.exp-picker-results{max-height:350px;overflow-y:auto;overscroll-behavior:contain}
.exp-choice{display:flex;align-items:center;gap:9px;width:100%;border:0;border-bottom:1px solid #edf2f5;background:white;color:#28475d;padding:10px 12px;cursor:pointer;text-align:left;min-height:43px}
.exp-choice:last-child{border-bottom:0}
.exp-choice:hover,.exp-choice:focus-visible{background:#eef7fb}
.exp-choice:focus-visible{outline:2px solid #83bdf3;outline-offset:-2px}
.exp-choice.selected{background:#eff7fa;font-weight:750}
.exp-picker-empty{padding:15px;text-align:center;font-size:12px;color:#718899}
@media(max-width:580px){
 .exp-field{min-width:100%;flex-basis:100%}
 .exp-picker-menu{width:100%}
 .exp-picker-trigger{gap:5px;padding:7px}
 .exp-option-meta{gap:4px}
 .exp-res{min-width:18px;height:19px}
 .exp-choice{gap:5px;padding:10px 8px}
 .exp-time{padding:3px 4px}
}

/* v1.3 scheduler: independent expedition slot timelines and daily departure editor */
.timeline-head,.timeline-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;align-items:center}
.timeline-hours{display:flex;justify-content:space-between;color:#71879a;font-size:10px;font-variant-numeric:tabular-nums;padding-bottom:7px}
.timeline-row{margin:8px 0}
.timeline-label{font-size:12px;font-weight:800;color:#31546d}
.timeline-track{position:relative;height:40px;border:1px solid #d5e2eb;border-radius:7px;background:repeating-linear-gradient(90deg,transparent 0%,transparent calc(16.6667% - 1px),#dae5ec calc(16.6667% - 1px),#dae5ec 16.6667%),#f1f6fa;overflow:hidden}
.timeline-bar{position:absolute;top:5px;bottom:5px;background:#327aa3;border:1px solid #1f5f85;border-radius:5px;display:flex;align-items:center;padding:0 4px;color:white;font-size:10px;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.timeline-bar span{overflow:hidden;text-overflow:ellipsis}
.schedule-entry{border:1px solid #e1eaf0;border-radius:10px;padding:10px 12px;margin-top:10px;background:#fbfdff}
.schedule-entry-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.schedule-entry-fields .field.exp-field{flex:2 1 280px;min-width:200px}
.schedule-entry-fields .field{flex:1 1 115px;min-width:100px}
.schedule-entry-fields .field.schedule-clock{flex:0 0 137px}
.schedule-entry-fields .field.schedule-formation{flex:1 1 145px}
.schedule-entry-fields input[type=time]{font-variant-numeric:tabular-nums}
.schedule-entry .schedule-remove,.schedule-entry .schedule-duplicate{flex:none;margin-bottom:1px}
.schedule-entry .schedule-duplicate{white-space:nowrap}
.schedule-clock .schedule-time-input{font-variant-numeric:tabular-nums;letter-spacing:.08em}
.schedule-entry-note{display:flex;gap:14px;flex-wrap:wrap;color:#74889a;font-size:11px;margin-top:6px}
.schedule-entry-note .scheduled{color:#176a4b;font-weight:750}
.schedule-entry-note .unplaced{color:#b17c2b;font-weight:750}
.schedule-entry.schedule-conflict{border-color:#e9c77e;background:#fffaf0}
@media(max-width:650px){.timeline-head,.timeline-row{grid-template-columns:57px minmax(0,1fr);gap:5px}.timeline-label{font-size:11px}.timeline-hours{font-size:9px}.schedule-entry-fields .field.exp-field{flex:1 1 100%;min-width:0}.schedule-entry-fields .field.schedule-clock{flex:1 1 120px}.schedule-entry-fields .field.schedule-formation{flex:1 1 160px}}


/* v1.5: per-preset operational day from HHMM to the same time tomorrow */
.schedule-day-start{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;background:#eef6fb;border:1px solid #d5e7f0;border-radius:10px;padding:12px;margin-bottom:12px}
.schedule-day-start .field.schedule-clock{width:178px;flex-shrink:0}
.schedule-day-start .note{flex:1;min-width:190px;margin:0 0 5px}
.schedule-day-start input{font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* v1.6: recurring intervals when the user cannot operate the game */
.schedule-unavailable{padding:14px;margin:10px 0;border:1px solid #d9e6ed;border-radius:10px;background:#f9fcfe}
.schedule-unavailable .row-between{gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.schedule-unavailable h3{font-size:14px;margin:0}
.schedule-unavailable .note{margin:3px 0 8px}
.schedule-away-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:10px;margin:8px 0}
.schedule-away-row .field.schedule-clock{flex:0 1 135px;min-width:105px}
.schedule-away-row input{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.away-separator{margin-bottom:8px;color:#5d7587}
.schedule-away-row .btn{margin-bottom:1px}
.timeline-unavailable{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(210,136,66,.20) 0,rgba(210,136,66,.20) 5px,rgba(230,170,106,.09) 5px,rgba(230,170,106,.09) 10px);z-index:1;pointer-events:none}
.timeline-bar{z-index:2}
@media(max-width:480px){.schedule-away-row{gap:6px}.schedule-away-row .field.schedule-clock{flex:1 1 105px}}

/* v1.7 advisory schedule warnings; never prevent an otherwise valid departure edit. */
.schedule-entry-note .warning{margin:0;padding:4px 8px}
.schedule-entry-note .chip .btn{margin-left:5px}

<script>
/* 艦これ遠征収支 — browser/node-compatible pure calculation functions */
(function(root){
'use strict';
const KEYS=['fuel','ammo','steel','bauxite','ネジ'];
const zero=()=>Object.fromEntries(KEYS.map(k=>[k,0]));
const add=(a,b,factor=1)=>{for(const k of KEYS) a[k]=(a[k]||0)+(b[k]||0)*factor;return a};
const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,Number.isFinite(Number(n))?Number(n):lo));
const EQUIPMENT={68:{name:'大発動艇',base:.05,regular:true},193:{name:'特大発動艇',base:.05,special:true},166:{name:'陸戦隊',base:.02},167:{name:'特二式内火艇',base:.01},408:{name:'装甲艇(AB艇)',base:.02},409:{name:'武装大発',base:.03},75:{name:'ドラム缶',drum:true}};
const DRUM_GREAT={"21":[3,4],"37":[3,5],"38":[4,10],"24":[1,2],"40":[1,4],"44":[3,8],"E2":[3,6]};
const SPECIAL_PROB_IDS=new Set(['A2','A3','41','45','A4','A5','A6','B3','B4','B5','B6','43','44','46','D3','E1','E2']);
function equipmentTotals(fleet){
 const eq=[];
 for(const ship of fleet?.ships||[]) for(const item of ship.items||[]) eq.push(item);
 const ext=fleet?.extraEquipment||{};
 for (const [key,id] of [['daihatsu',68],['tokudai',193],['tank',166],['katsu',167],['armed',409],['drum',75]]) {
   for(let i=0;i<clamp(ext[key]||0,0,30);i++)eq.push({id,rf:clamp(ext.star||0,0,10),fromManual:true});
 }
 let base=0,regular=0,special=0,drum=0,stars=0,starCount=0,unknown=[];
 const shipDrums=new Set();
 for(const ship of fleet?.ships||[]){if((ship.items||[]).some(item=>Number(item.id)===75))shipDrums.add(ship.id||ship.name)}
 for(const item of eq){const e=EQUIPMENT[Number(item.id)];if(!e){if(item.id)unknown.push(item.id);continue;}
   if(e.drum){drum++;continue;}base+=e.base||0;if(e.regular)regular++;if(e.special)special++;
   stars+=clamp(item.rf||0,0,10);starCount++;
 }
 // Manual drum counts have no ship assignment; can't verify drum-carrying ship count with only manual counts.
 const kinu=(fleet?.ships||[]).some(x=>x.kinu);
 base=Math.min(.2,base+(kinu?.05:0));
 const averageStars=starCount?stars/starCount:0;
 const bonusStar=base*.01*averageStars;
 const bonusSpecial=special<3?.02*special:special===3?[.05,.05,.052,.054,.054][Math.min(regular,4)]:[.054,.056,.058,.059,.06][Math.min(regular,4)];
 return {base,bonusStar,bonusSpecial,percent:(base+bonusStar+bonusSpecial)*100,drum,drumShips:shipDrums.size,regular,special,unknown};
}
function getProb(row,fleet,commonPercent,exp){
 if(row.probMode==='manual')return {value:clamp(row.greatPct,0,100)/100,description:'個別指定'};
 if(row.probMode==='fleet'&&fleet){
   const ships=fleet.ships||[];const kira=ships.filter(x=>x.kira).length;
   const dr=DRUM_GREAT[exp?.id];const t=equipmentTotals(fleet);
   if(dr && kira>=4 && t.drum>=dr[1] && t.drumShips>=dr[0])return {value:1,description:'ドラム缶条件（確定）'};
   if(dr)return {value:clamp(commonPercent,0,100)/100,description:'共通率で代用',warning:'ドラム缶型の大成功率を自動判定できないため、共通設定を使用'};
   if(SPECIAL_PROB_IDS.has(exp?.id))return {value:clamp(commonPercent,0,100)/100,description:'共通率で代用',warning:'特殊判定型のため共通大成功率を使用'};
   if(kira===ships.length&&kira===6)return {value:1,description:'6隻全キラ'};
   if(kira===ships.length&&kira===5)return {value:.95,description:'5隻全キラ（推定）'};
   if(kira===ships.length&&kira===4)return {value:.80,description:'4隻全キラ（推定）'};
   return {value:0,description:'通常型：全キラ条件外'};
 }
 return {value:clamp(commonPercent,0,100)/100,description:row.probMode==='fleet'?'艦隊未設定→共通':'共通設定'};
}
function getBonus(row,fleet){
 if(row.bonusMode==='manual')return {percent:clamp(row.bonusPct||0,0,100),automatic:false,parts:null};
 if(row.bonusMode==='fleet'&&fleet){let parts=equipmentTotals(fleet);return {percent:parts.percent,automatic:true,parts};}
 return {percent:0,automatic:false,parts:null};
}
function shipCost(ship,pct,key){
 const n=Number(ship?.[key]);
 if(ship?.[key]===null||ship?.[key]===undefined||ship?.[key]===''||!Number.isFinite(n))return null;
 // Ship fuel/ammo capacity is entered as *pre-marriage* maximum supply cost.
 return Math.floor(Math.floor(n*(ship.married?.85:1))*pct/100+1e-9);
}
function calcFuelCost(row,exp,fleet){
 if(row.costMode==='manual')return {fuel:clamp(row.costFuel,0,5000),ammo:clamp(row.costAmmo,0,5000),status:'手入力'};
 if(!fleet)return null;
 const ships=fleet.ships||[];
 if(!ships.length)return null;
 let fuel=0,ammo=0;
 for(const ship of ships){const f=shipCost(ship,exp.consumptionPct.fuel,'fuel');const a=shipCost(ship,exp.consumptionPct.ammo,'ammo');if(f===null||a===null)return null;fuel+=f;ammo+=a;}
 return {fuel,ammo,status:'編成から算出'};
}
function expeditionOutcome(row,exp,fleets,settings){
 const fleet=fleets.find(x=>String(x.id)===String(row.fleetId));const prob=getProb(row,fleet,settings.commonGreatPct,exp);const bonus=getBonus(row,fleet);
 let earned=zero(),cost=zero(),detail={};const b=bonus.percent/100;
 for(const key of KEYS.slice(0,4)){
   const base=exp.rewards[key]||0;
   let normal,great;
   if(bonus.automatic&&bonus.parts){const {base:part,bonusStar,bonusSpecial}=bonus.parts;
     normal=Math.floor(base*(1+part+bonusStar)+1e-8)+Math.floor(base*bonusSpecial+1e-8);
     great=Math.floor(base*1.5*(1+part+bonusStar)+1e-8)+Math.floor(base*1.5*bonusSpecial+1e-8);
   }else{normal=Math.floor(base*(1+b)+1e-8);great=Math.floor(base*1.5*(1+b)+1e-8);}
   detail[key]={normal,great};earned[key]=normal*(1-prob.value)+great*prob.value;
 }
 for(const [key,n] of Object.entries(exp.greatItems||{}))earned[key]=(earned[key]||0)+n*prob.value;
 const shipCosts=calcFuelCost(row,exp,fleet);let costKnown=!!shipCosts;if(shipCosts){cost.fuel=shipCosts.fuel;cost.ammo=shipCosts.ammo;}
 return {exp,prob,bonus,earned,cost,costKnown,detail,fleetName:fleet?.name||'',hasFleet:!!fleet};
}
// Expedition occupation is measured as cumulative fleet-minutes, not elapsed wall-clock time.
// The three available expedition slots permit at most 72 fleet-hours per day in total.
// A named fleet may not occupy more than 24h/day. Unassigned rows count towards
// the total but cannot be individually checked for collisions.
function occupationForRows(rows,fleets,expeditions,monthly=false){
 const map=new Map(expeditions.map(x=>[x.id,x]));
 const groups=new Map();
 for(const f of fleets||[])groups.set(String(f.id),{id:String(f.id),name:f.name||'名称未設定',minutes:0,runs:0,assigned:true});
 groups.set('',{id:'',name:'編成なし',minutes:0,runs:0,assigned:false});
 const details=[];let totalMinutes=0,totalRuns=0;
 for(const row of rows||[]){
   const exp=map.get(row.expId);if(!exp||!!exp.monthly!==!!monthly)continue;
   const count=clamp(row.count,0,monthly?1:200);
   if(count<=0)continue;
   const minutes=clamp(exp.minutes,0,100000)*count;
   const key=groups.has(String(row.fleetId||''))?String(row.fleetId||''):'';
   const group=groups.get(key);
   group.minutes+=minutes;group.runs+=count;
   totalMinutes+=minutes;totalRuns+=count;
   details.push({rowId:row.id,expId:exp.id,expName:exp.name,fleetId:key,count,minutes,oneRunMinutes:exp.minutes});
 }
 const list=[...groups.values()];
 const warnings=[];
 if(!monthly){
   if(totalMinutes>72*60+1e-7)warnings.push(`合計 ${formatOccupation(totalMinutes)} は、3艦隊×24時間＝72時間を超えています。`);
   for(const g of list)if(g.assigned&&g.minutes>24*60+1e-7)warnings.push(`${g.name} の占有 ${formatOccupation(g.minutes)} は1日24時間を超えています。`);
 }
 return {totalMinutes,totalRuns,groups:list,details,unassignedMinutes:groups.get('').minutes,warnings};
}
function formatOccupation(minutes){
 const m=Math.round(minutes);
 return `${Math.floor(m/60)}時間${m%60?`${m%60}分`:''}`;
}
function sumPreset(preset,fleets,settings,expeditions){
 const map=new Map(expeditions.map(x=>[x.id,x]));const earned=zero(),cost=zero(),details=[];let allCostKnown=true,runs=0,unestimated=0;
 for(const row of preset?.rows||[]){const exp=map.get(row.expId);const count=clamp(row.count,0,200);if(!exp||count===0||exp.monthly)continue;
 const v=expeditionOutcome(row,exp,fleets,settings);add(earned,v.earned,count);
 if(v.costKnown)add(cost,v.cost,count);else{allCostKnown=false;unestimated+=count;}
 runs+=count;details.push({...v,count,row});}
 return {earned,cost,allCostKnown,runs,unestimated,details,occupation:occupationForRows(preset?.rows,fleets,expeditions,false)};
}
function sumMonthly(monthlyRows,fleets,settings,expeditions){
 const earned=zero(),cost=zero(),details=[];let allCostKnown=true,runs=0,unestimated=0;
 const m=new Map(expeditions.map(x=>[x.id,x]));
 for(const row of monthlyRows||[]){const exp=m.get(row.expId);if(!exp||!exp.monthly)continue;const count=clamp(row.count,0,1);if(!count)continue;
 let v=expeditionOutcome(row,exp,fleets,settings);add(earned,v.earned,count);if(v.costKnown)add(cost,v.cost,count);else{allCostKnown=false;unestimated+=count;}runs+=count;details.push({...v,count,row});}
 return {earned,cost,allCostKnown,runs,unestimated,details,occupation:occupationForRows(monthlyRows,fleets,expeditions,true)};
}
function computePlan(state,expeditions){
 const presets=state.presets||[],fleets=state.fleets||[],settings=state.settings||{commonGreatPct:80};
 const perPreset=Object.fromEntries(presets.map(p=>[p.id,sumPreset(p,fleets,settings,expeditions)]));
 const weeklyEarn=zero(),weeklyCost=zero();let weekRuns=0,weekUnknown=0,weekMinutes=0,allocDays=0;

function duplicateScheduleDeparture(p,sid){
 const original=p.schedule?.find(s=>s.id===sid);
 const row=p.rows.find(r=>r.id===original?.rowId);
 const expedition=EXP_MAP.get(row?.expId);
 if(!original||!row||!expedition)return false;
 const clonedRow=structuredClone(row);
 clonedRow.id=uid();clonedRow.count=1;
 const hasStart=original.start!==null&&original.start!==undefined&&original.start!=='';
 const base=E.dayStartMinutes(p);
 const originalOffset=Math.max(0,Number(original.dayOffset)||0);
 const returnMinutes=hasStart?E.dayAbsoluteMinute(original.start,base)+originalOffset*1440+Number(expedition.minutes):null;
 const availableMinutes=hasStart?E.nextAvailableMinute(p,returnMinutes):null;
 const newStart=hasStart?((availableMinutes%1440)+1440)%1440:null;
 // Preserve the operational-day offset when a clone crosses the next day's
 // baseline. Merely storing HHMM would wrongly move it back to the previous day.
 const startOffset=hasStart?Math.max(0,Math.round((availableMinutes-E.dayAbsoluteMinute(newStart,base))/1440)):0;
 const clonedDeparture={id:uid(),rowId:clonedRow.id,slot:original.slot||'',start:newStart,dayOffset:startOffset};
 // Conflicts and overflow are advisory and remain visible in the schedule audit.
 p.rows.push(clonedRow);
 const at=p.schedule.findIndex(s=>s.id===sid);
 p.schedule.splice(at+1,0,clonedDeparture);
 return true;
}

function splitScheduleRow(p,entry){

function renderCompare(){

 const a=E.computePlan(get(ui.compareA),EXP),b=E.computePlan(get(ui.compareB),EXP);

 return `<div class="stack"><section class="panel section"><div class="sectionhead"><div><h2>条件の一時保存と比較</h2><p>編成・プリセット・適用日数を含めて最大8件保持。同じタブ内だけの一時保存です。</p></div>${button('save-snapshot','+ 現在条件を保存','btn primary')}</div>

 <div class="compare-grid" style="margin-top:17px"><div class="field"><label>比較元 A</label><select data-change="compareA">${options(all,ui.compareA)}</select></div><div class="field"><label>比較先 B</label><select data-change="compareB">${options(all,ui.compareB)}</select></div></div>
 <p class="note">差分は B − A で表示します。週間は基本運用、月間・年間は例外と月次遠征も含めます。</p>
 <div style="overflow-x:auto"><table class="difftable"><thead><tr><th>項目（${{weekly:'週間',monthly:'月間',yearly:'年間'}[t]}）</th><th>条件 A</th><th>条件 B</th><th>差分 B−A</th></tr></thead><tbody>
 ${[['fuel','燃料'],['ammo','弾薬'],['steel','鋼材'],['bauxite','ボーキ'],['ネジ','ネジ（期待値）']].map(([key,label])=>{const d=eb.earned[key]-ea.earned[key];return `<tr><td>${label}</td><td>${fmt(ea.earned[key])}</td><td>${fmt(eb.earned[key])}</td><td class="${d>0?'positive':d<0?'negative':''}">${signed(d)}</td></tr>`}).join('')}
 <tr><td>遠征回数</td><td>${fmt(ea.runs)}</td><td>${fmt(eb.runs)}</td><td class="${eb.runs-ea.runs>0?'positive':eb.runs-ea.runs<0?'negative':''}">${signed(eb.runs-ea.runs)}</td></tr>
 <tr><td>延べ占有時間</td><td>${fmt(ea.minutes/60)} 時間</td><td>${fmt(eb.minutes/60)} 時間</td><td>${signed((eb.minutes-ea.minutes)/60)} 時間</td></tr>
 <tr><td>純収支（燃料）</td><td>${ea.unestimated?'未計算':fmt(ea.earned.fuel-ea.cost.fuel)}</td><td>${eb.unestimated?'未計算':fmt(eb.earned.fuel-eb.cost.fuel)}</td><td>${ea.unestimated||eb.unestimated?'—':signed((eb.earned.fuel-eb.cost.fuel)-(ea.earned.fuel-ea.cost.fuel))}</td></tr>
 <tr><td>純収支（弾薬）</td><td>${ea.unestimated?'未計算':fmt(ea.earned.ammo-ea.cost.ammo)}</td><td>${eb.unestimated?'未計算':fmt(eb.earned.ammo-eb.cost.ammo)}</td><td>${ea.unestimated||eb.unestimated?'—':signed((eb.earned.ammo-eb.cost.ammo)-(ea.earned.ammo-ea.cost.ammo))}</td></tr>

 <section class="panel section"><h2>データのバックアップ</h2><p class="note">通常設定はこのブラウザに自動保存されます。長期保管・別端末への移行にはJSONを使用してください。</p><div class="row-wrap">${button('export-json','設定JSONをエクスポート','btn primary')}${button('import-json','設定JSONをインポート')}<input type="file" id="json-file" accept="application/json,.json" class="hidden"></div><div class="divider"></div><h3>サンプルデータ・初期化</h3><div class="row-wrap">${button('load-sample','サンプル運用を読み込む')}${button('reset-all','初期化','btn danger')}</div><p class="note">初期化すると現在の設定が消えます。比較用スナップショットは別に保持されます。</p></section></div>`;
}

 const main=one('#app');
 const plan=E.computePlan(state,EXP);
 main.innerHTML=`<div class="top"><div class="container"><div class="toprow"><div><div class="brand"><div class="mark">≋</div><div><div class="eyebrow">KAN-COLLE / EXPEDITION ANALYTICS</div><h1>遠征収支シミュレータ <span class="tag">v1.6</span></h1></div></div><p class="subtitle">いつもの遠征運用を、週・月・年の資源収支に。</p></div><div class="topactions">${button('save-snapshot','条件を一時保存','btn light')}${button('export-json','JSON保存','btn light')}</div></div></div></div>
 <main class="container shell">${renderOverview()}<nav class="nav" aria-label="画面切り替え">${[['plan','運用プリセット'],['scheduler','スケジューラー'],['mapping','編成別遠征'],['fleet','艦隊・装備'],['compare','条件比較・保存']].map(([id,label])=>`<button type="button" data-action="tab" data-tab="${id}" class="${ui.tab===id?'active':''}">${label}</button>`).join('')}</nav>

 <footer class="footer footnotes">非公式ファンツール。艦これの運営元・攻略Wikiとは無関係です。計算は成功率100%を前提とする期待値で、キラ維持の手間・交戦遠征の修理費・ランダム獲得アイテムは算出していません。月間は365÷7÷12週換算です。<br>遠征データ・消費率：<a target="_blank" rel="noopener noreferrer" href="https://wikiwiki.jp/kancolle/%E9%81%A0%E5%BE%81">艦これ攻略Wiki（遠征）</a> / <a target="_blank" rel="noopener noreferrer" href="https://kouryakulab.com/ja/games/kancolle/expedition-requirements/">遠征一覧</a>。大発補正：<a href="https://wikiwiki.jp/kancolle/%E7%89%B9%E5%A4%A7%E7%99%BA%E5%8B%95%E8%89%87" rel="noopener noreferrer" target="_blank">特大発動艇</a>。</footer></main>`;

function removeFleetRefs(id){for(const p of state.presets)for(const row of p.rows)if(row.fleetId===id)row.fleetId='';for(const row of state.monthlyRows)if(row.fleetId===id)row.fleetId='';}
function addFleet(){const f={id:uid(),name:`編成${state.fleets.length+1}`,ships:[],extraEquipment:{}};state.fleets.push(f);ui.selectedFleet=f.id;}
function newShip(){return {id:uid(),shipId:'',name:'艦娘',level:99,married:false,kira:false,kinu:false,fuel:null,ammo:null,items:[]}}
function handleClick(e){
 const selectedPicker=e.target.closest('.exp-picker');
 // Only one picker may be open; outside click closes the menu without changing data.
 for(const picker of document.querySelectorAll('.exp-picker[open]'))if(picker!==selectedPicker)picker.open=false;
 if(e.target.closest('.exp-picker-trigger')){
  const picker=e.target.closest('.exp-picker');
  if(!picker.open)setTimeout(()=>{if(picker.open)picker.querySelector('.exp-picker-search input')?.focus();},0);
 }
 if(e.target.closest('.map-monthly-summary')){ui.monthlyMappingOpen=!ui.monthlyMappingOpen;return;}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,d=b.dataset;
 if(a==='select-exp'){
  if(d.sid){const p=presetById(d.pid);if(p&&!scheduleEditExp(p,d.sid,d.value))return;update(()=>{});return;}
  update(()=>{const {row}=findRow(b);if(row)row.expId=d.value;});
  return;
 }
 if(a==='period'){ui.period=d.period;render();return}
 if(a==='display'){ui.display=d.display;render();return}
 if(a==='tab'){ui.tab=d.tab;render();return}
 if(a==='choose-preset'){ui.selectedPreset=d.pid;ui.expandedRow='';render();return}
 if(a==='choose-fleet'){ui.selectedFleet=d.fid;render();return}
 if(a==='expand-row'){ui.expandedRow=ui.expandedRow===d.rid?'':d.rid;render();return}
 if(a==='export-json'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='kancolle-expedition-settings.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
 if(a==='import-json'){const file=one('#json-file');if(!file){ui.tab='compare';render();one('#json-file').click();}else file.click();return}
 if(a==='import-deck'){const raw=one('#deck-text')?.value.trim();if(!raw){alert('デッキビルダー形式のJSONを貼り付けてください。');return}
   try{const imported=parseDeck(raw);if(!imported.length)throw Error('f1〜f4 に艦娘が見つかりません');update(()=>{state.fleets.push(...imported);ui.selectedFleet=imported[0].id;ui.importNotice=`${imported.length}編成を読み込みました。`});}catch(err){alert('読み込み失敗：'+err.message)}return;}
 if(a==='save-snapshot'){const name=prompt('保存する条件名',`条件 ${snaps.length+1}`);if(name===null)return;
   if(snaps.length>=8){alert('一時保存は最大8件です。不要な条件を削除してください。');return;}
   snaps.push({id:uid(),name:name.trim()||`条件 ${snaps.length+1}`,savedAt:new Date().toLocaleString('ja-JP'),data:structuredClone(state)});setStorage(SNAP,snaps,SS);ui.compareA=snaps[snaps.length-1].id;ui.compareB='current';ui.tab='compare';render();return}
 if(a==='restore-snapshot'){const s=snaps.find(s=>s.id===d.sid);if(s&&confirm(`「${s.name}」を現在の設定に復元しますか？`))update(()=>{state=structuredClone(s.data);ui.selectedPreset=state.presets[0]?.id||'';ui.selectedFleet=state.fleets[0]?.id||'';});return}
 if(a==='delete-snapshot'){snaps=snaps.filter(s=>s.id!==d.sid);setStorage(SNAP,snaps,SS);render();return}
 if(a==='reset-all'){if(confirm('現在の設定を初期化しますか？（元に戻せません）'))update(()=>{state=blankState();ui.selectedPreset='p1';ui.selectedFleet='';ui.expandedRow='';});return}
 if(a==='load-sample'){if(confirm('サンプル運用で現在の設定を上書きしますか？'))update(()=>{state=E.sample();ui.selectedPreset='p1';ui.selectedFleet='';ui.expandedRow='';ui.tab='plan';});return}
 if(a==='schedule-enable'){update(()=>{const p=presetById(d.pid);if(p){p.scheduleEnabled=true;p.schedule=[];}});return}
 if(a==='schedule-disable'){if(!confirm('このプリセットの時刻と艦隊枠の割当を解除しますか？　遠征と回数は残ります。'))return;update(()=>{const p=presetById(d.pid);if(p){p.scheduleEnabled=false;p.schedule=[];}});return}
 if(a==='schedule-add'){update(()=>{const p=presetById(d.pid);if(!p)return;p.rows.push(E.makeRow('05'));});return}
 if(a==='schedule-away-add'){

 }
 if(a==='schedule-away-remove'){

 }

 }

 if(a==='schedule-remove'){update(()=>{const p=presetById(d.pid);if(!p)return;const s=p.schedule?.find(x=>x.id===d.sid);if(!s)return;const r=p.rows.find(x=>x.id===s.rowId);p.schedule=p.schedule.filter(x=>x.id!==s.id);if(r){r.count=Math.max(0,r.count-1);if(r.count===0)p.rows=p.rows.filter(x=>x.id!==r.id);}});return}

  }else if(a==='remove-preset'){
   if(state.presets.length<=1){alert('最低1つのプリセットは必要です。');return}
   if(!confirm('プリセットを削除しますか？週間割当や月間例外の参照も削除します。'))return;
   state.presets=state.presets.filter(p=>p.id!==d.pid);state.weekly=state.weekly.filter(x=>x.presetId!==d.pid);state.exceptions=state.exceptions.filter(x=>x.presetId!==d.pid&&x.replaceId!==d.pid);ui.selectedPreset=state.presets[0].id;
  }else if(a==='add-row'){const p=presetById(d.pid);p?.rows.push(E.makeRow('05'));}
  else if(a==='add-row-for-fleet'){
   const p=presetById(d.pid);if(p){const row=E.makeRow('05');row.fleetId=d.fid||'';if(row.fleetId){row.probMode='fleet';row.bonusMode='fleet'}p.rows.push(row);}
  }
  else if(a==='add-monthly')state.monthlyRows.push(E.makeRow('A4'));
  else if(a==='add-monthly-for-fleet'){
   const row=E.makeRow('A4');row.fleetId=d.fid||'';if(row.fleetId){row.probMode='fleet';row.bonusMode='fleet'}state.monthlyRows.push(row);
  }
  else if(a==='remove-row'){const {arr}=findRow(b);if(arr)arr.splice(arr.findIndex(x=>x.id===d.rid),1);ui.expandedRow='';}
  else if(a==='add-week')state.weekly.push({presetId:state.presets[0]?.id||'',days:0});
  else if(a==='remove-week')state.weekly.splice(Number(d.index),1);
  else if(a==='add-exception')state.exceptions.push({id:uid(),name:'例外運用',presetId:state.presets[1]?.id||state.presets[0]?.id,replaceId:state.presets[0]?.id,count:1});
  else if(a==='remove-exception')state.exceptions.splice(Number(d.index),1);
  else if(a==='add-fleet')addFleet();
  else if(a==='remove-fleet'){const f=fleetById(ui.selectedFleet);if(f&&confirm(`${f.name}を削除しますか？`)){state.fleets=state.fleets.filter(x=>x.id!==f.id);removeFleetRefs(f.id);ui.selectedFleet=state.fleets[0]?.id||''}}
  else if(a==='add-ship'){const f=fleetById(ui.selectedFleet);if(f){if(f.ships.length>=7){alert('1編成には最大7隻です。');return;}f.ships.push(newShip())}}
  else if(a==='remove-ship'){const f=fleetById(d.fid);f?.ships.splice(Number(d.index),1)}
 });
}
function handleChange(e){const t=e.target,d=t.dataset,type=d.change;if(!type)return;
 if(type==='compareA'||type==='compareB'){ui[type]=t.value;render();return}
 if(type==='schedule-away'){
  const p=presetById(d.pid),period=p?.unavailablePeriods?.[Number(d.index)];
  if(!period)return;
  const parsed=E.parseClockDigits(t.value);
  if(parsed===undefined||parsed===null||parsed===period[d.field==='start'?'end':'start']){
   alert('触れない時間帯は開始・終了を異なる4桁時刻で指定してください（例：0900〜1800）。');render();return;
  }
  update(()=>{period[d.field]=parsed;});return;
 }
 if(type==='schedule-base'){
  const p=presetById(d.pid);
  if(!p)return;
  const parsed=E.parseClockDigits(t.value);
  if(parsed===undefined||parsed===null){alert('1日の基準時刻は 0000〜2359 の4桁数字で入力してください（例：0700）。');render();return;}
  // Day-boundary conflicts are advisory: keep the edited value and show warnings.
  update(()=>{p.dayStart=parsed;});return;
 }
 if(type==='schedule'){
  const p=presetById(d.pid),entry=p?.schedule?.find(x=>x.id===d.sid),row=p?.rows.find(x=>x.id===entry?.rowId);
  if(!p||!entry||!row)return;
  if(d.field==='formationId'){
   update(()=>{splitScheduleRow(p,entry);const changed=p.rows.find(x=>x.id===entry.rowId);changed.fleetId=t.value;
     if(t.value){if(changed.probMode==='common')changed.probMode='fleet';if(changed.bonusMode==='none')changed.bonusMode='fleet';}});
   return;
  }
  const parsed=d.field==='start'?E.parseClockDigits(t.value):null;
  if(d.field==='start'&&parsed===undefined){alert('開始時刻は 0000〜2359 の4桁数字で入力してください（例：0830）。');render();return;}
  const value=d.field==='start'?parsed:t.value;
  // Overlap/day-boundary issues are warnings, not blockers.
  update(()=>{entry[d.field]=value;});return;
 }
 update(()=>{
 const num=new Set(['count','greatPct','bonusPct','costFuel','costAmmo','days','level','fuel','ammo','daihatsu','tokudai','tank','katsu','armed','drum','star']);
 const v=num.has(d.field)?(t.value===''?null:Number(t.value)):t.value;
 if(type==='common')state.settings.commonGreatPct=E.clamp(t.value,0,100);
 else if(type==='row'){const {row}=findRow(t);if(row){const firstFleet=d.field==='fleetId'&&!row.fleetId&&!!v;row[d.field]=v;if(firstFleet){if(row.probMode==='common')row.probMode='fleet';if(row.bonusMode==='none')row.bonusMode='fleet';}if(d.field==='count')row.count=E.clamp(v,0,d.scope==='monthly'?1:200)}}
 else if(type==='weekly')state.weekly[Number(d.index)][d.field]=d.field==='days'?E.clamp(v,0,7):v;
 else if(type==='exception')state.exceptions[Number(d.index)][d.field]=d.field==='count'?E.clamp(v,0,31):v;
 else if(type==='preset-name'){const p=presetById(d.pid);if(p)p.name=t.value.slice(0,50)||'名称未設定'}
 else if(type==='fleet-name'){const f=fleetById(d.fid);if(f)f.name=t.value.slice(0,50)||'名称未設定'}
 else if(type==='ship'||type==='ship-check'){const f=fleetById(d.fid),ship=f?.ships[Number(d.index)];if(ship){ship[d.field]=type==='ship-check'?t.checked:v;if(d.field==='level'&&Number(v)>=100&&Number(ship.level)<100)ship.married=true;}}
 else if(type==='equipment'){const f=fleetById(d.fid);if(f){f.extraEquipment??={};f.extraEquipment[d.field]=E.clamp(v,0,d.field==='star'?10:30);}}
 });
}
function parseDeck(raw){
 let json=JSON.parse(raw);
 if(json.data&&typeof json.data==='object')json=json.data;
 let result=[];
 for(let fi=1;fi<=4;fi++){
  const group=json[`f${fi}`];if(!group||typeof group!=='object')continue;
  let ships=[];
  for(let si=1;si<=7;si++){
   const s=group[`s${si}`];if(!s||!s.id||String(s.id)==='0')continue;
   const items=Object.values(s.items||{}).filter(x=>x&&x.id&&Number(x.id)>0).map(x=>({id:Number(x.id),rf:Number(x.rf||0)}));
   const level=Number(s.lv||1);
   ships.push({id:uid(),shipId:String(s.id),name:`艦娘ID ${s.id}`,level,married:level>=100,kira:false,kinu:false,fuel:null,ammo:null,items});
  }
  if(ships.length)result.push({id:uid(),name:`インポート艦隊${fi}`,ships,extraEquipment:{}});
 }
 return result;
}
// Filter the currently opened expedition menu without re-rendering the application.
document.addEventListener('input',e=>{
 if(!e.target.matches('.exp-picker-search input'))return;
 const picker=e.target.closest('.exp-picker');
 const query=e.target.value.normalize('NFKC').trim().toLowerCase();
 let shown=0;
 for(const choice of picker.querySelectorAll('.exp-choice')){
  const matched=choice.dataset.search.normalize('NFKC').includes(query);
  choice.classList.toggle('hidden',!matched);
  if(matched)shown++;
 }
 picker.querySelector('.exp-picker-empty')?.classList.toggle('hidden',shown>0);
});
document.addEventListener('keydown',e=>{
 const picker=e.target.closest('.exp-picker[open]');if(!picker)return;
 if(e.key==='Escape'){e.preventDefault();picker.open=false;picker.querySelector('summary')?.focus();return;}
 const buttons=[...picker.querySelectorAll('.exp-choice:not(.hidden)')];
 if(e.key==='Enter'&&e.target.matches('.exp-picker-search input')){e.preventDefault();buttons[0]?.click();return;}
 if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
 if(!e.target.matches('.exp-picker-search input, .exp-choice, .exp-picker-trigger'))return;
 e.preventDefault();const current=buttons.indexOf(e.target);
 const step=e.key==='ArrowDown'?1:-1;
 buttons[(current<0?(step>0?0:buttons.length-1):(current+step+buttons.length)%buttons.length)]?.focus();
});
document.addEventListener('click',handleClick);
document.addEventListener('change',handleChange);
document.addEventListener('change',async e=>{
 if(e.target.id==='json-file'){const file=e.target.files?.[0];if(!file)return;
 try{let incoming=JSON.parse(await file.text());if(incoming.version!==1||!Array.isArray(incoming.presets)||!Array.isArray(incoming.fleets))throw Error('未対応の設定形式です');if(!confirm('現在の設定をファイルの内容で上書きしますか？'))return;state=incoming;ui.selectedPreset=state.presets[0]?.id||'';ui.selectedFleet=state.fleets[0]?.id||'';persist();render();}catch(err){alert('読み込み失敗：'+err.message)}
 }
});
// Global common great probability control is inserted into overview by footer bar after first render.
const oldRender=render;
render=function(){oldRender();let summary=document.querySelector('.summary');const bar=document.createElement('div');bar.className='row-wrap';bar.style.cssText='margin-top:12px;padding-top:12px;border-top:1px solid #e5eef3;';bar.innerHTML=`<span class="note strong">共通大成功率</span><input type="number" min="0" max="100" step="1" value="${state.settings.commonGreatPct}" data-change="common" style="width:75px"><span class="note">%　（各遠征の「個別指定」「編成から推定」で上書き可）</span>`;summary.appendChild(bar);};
schedulePresets();
render();
})();
